name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install source checker
        run: python -m pip install ruff==0.16.8
      - name: Check Python
        run: |
          ruff check .
          ruff format --check .
      - name: Run model-free regressions
        run: python -m unittest discover -s tests/unit -v
      - name: Check authored browser JavaScript
        run: |
          find konbaung_reader_app/static -maxdepth 1 -type f -name '*.js' ! -name '*.min.js' -print0 | xargs -0 -r -n1 node --check

      - name: Build graph frontend
        working-directory: konbaung_reader_app
        run: |
          npm ci
          npm run build:frontend
